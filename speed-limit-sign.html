<script>
/* =====================================================================
   R2-1 spec — every number is a fraction of the sheet (plate) WIDTH,
   measured from the reference photo with pixel scans:

     sheet                1000 × 1250  (24"×30" blank, aspect 1.246)
     white margin             10       (outside the border)
     border                   28 thick, outer corner radius 30
     ink                      #202020
     SPEED   cap 171 · ink width 800 · baseline y 283
     LIMIT   cap 171 · ink width 611 · baseline y 536   (gap 82)
     50      cap 436 · ink width 750 · baseline y 1056  (gap 84)
     (legend vertically centered: ~112 gap above SPEED and below 50)
   ===================================================================== */
const SPEC = {
  W: 1000, H: 1250,
  margin: 10, border: 28, radius: 30,
  ink: '#202020', paper: '#ffffff',
  lines: [
    { text: 'SPEED', cap: 171, inkW: 800, baseline: 283 },
    { text: 'LIMIT', cap: 171, inkW: 611, baseline: 536 },
    { text: '50',    cap: 436, inkW: 750, baseline: 1056 },
  ],
  dashes: { cap: 436, inkW: 240, baseline: 1056 },   // no-data placeholder
};

const NS = 'http://www.w3.org/2000/svg';
const el = (t, attrs) => {
  const n = document.createElementNS(NS, t);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
};

// ---- calibration -----------------------------------------------------
// Canvas actualBoundingBox* gives TRUE ink extents. All placement math is
// done on ink (never em boxes or advances), so the SVG render lands on the
// measured targets regardless of font quirks.
async function calibrate() {
  await document.fonts.load('700 100px Overpass').catch(() => {});
  await document.fonts.ready;
  const c = document.createElement('canvas').getContext('2d');
  const ink = (font, s, spacingPx) => {
    c.font = font;
    if ('letterSpacing' in c) c.letterSpacing = (spacingPx || 0) + 'px';
    const m = c.measureText(s);
    const left = -m.actualBoundingBoxLeft, right = m.actualBoundingBoxRight;
    return { left, right, width: right - left, cap: m.actualBoundingBoxAscent };
  };
  return { ink };
}

// ---- build one sign ---------------------------------------------------
function buildSign(mount, widthPx, value, dashes) {
  const S = SPEC;
  const svg = el('svg', {
    viewBox: `0 0 ${S.W} ${S.H}`,
    width: widthPx, height: Math.round(widthPx * S.H / S.W),
    class: 'sign', 'aria-label': 'Speed limit sign',
  });
  // white sheet with rounded corners
  svg.appendChild(el('rect', {
    x: 0, y: 0, width: S.W, height: S.H, rx: S.radius, fill: S.paper }));
  // regulatory border (stroke centered on the inset rect)
  const inset = S.margin + S.border / 2;
  svg.appendChild(el('rect', {
    x: inset, y: inset,
    width: S.W - 2 * inset, height: S.H - 2 * inset,
    rx: Math.max(S.radius - S.margin - S.border / 2, 2),
    fill: 'none', stroke: S.ink, 'stroke-width': S.border }));

  const legend = el('g', { fill: S.ink });
  svg.appendChild(legend);
  mount.appendChild(svg);

  const mkCaption = spec => {
    const t = el('text', {
      'text-anchor': 'start',
      'font-family': "'Overpass', Arial, sans-serif",
      'font-weight': 700,
    });
    t.textContent = spec.text;
    legend.appendChild(t);
    return t;
  };

  const mkDashes = spec => {
    const g = el('g', {});
    const barW = 120, barH = 105, r = 14, cx = S.W / 2, off = 140;
    // center the dashes in the numeral band (620..1056), not on its baseline
    const bandTop = spec.baseline - spec.cap, bandMid = bandTop + spec.cap / 2;
    for (const dx of [-off, off]) {
      g.appendChild(el('rect', {
        x: cx + dx - barW / 2, y: bandMid - barH / 2,
        width: barW, height: barH, rx: r,
      }));
    }
    legend.appendChild(g);
    return g;
  };

  const lines = dashes ? [mkDashes(SPEC.dashes)]
                       : SPEC.lines.map(sp => mkCaption(sp));

  return { svg, lines, dashes, value };
}

// ---- solve each line: size from cap height, spacing from ink width ----
function fitLines(sign, cal) {
  const S = SPEC;
  if (sign.dashes) return;
  sign.lines.forEach((t, i) => {
    const spec = S.lines[i];
    // cap-height solve: measure cap at 100px, scale
    const probe = cal.ink(`700 100px 'Overpass', Arial, sans-serif`, 'H', 0);
    const size = spec.cap / (probe.cap / 100);
    const font = `700 ${size}px 'Overpass', Arial, sans-serif`;
    const n = spec.text.length;
    // natural ink width, then per-gap spacing to hit the target ink width
    let m = cal.ink(font, spec.text, 0);
    let s = n > 1 ? (spec.inkW - m.width) / (n - 1) : 0;
    // re-measure WITH spacing (spacing grows ink by exactly s*(n-1))
    m = cal.ink(font, spec.text, s);
    // start-anchored placement: pen x such that ink left = 500 - inkW/2
    const x = S.W / 2 - m.width / 2 - m.left;
    t.setAttribute('font-size', size);
    t.setAttribute('letter-spacing', s);
    t.setAttribute('x', x);
    t.setAttribute('y', spec.baseline);
    sign.lines[i] = { t, spec, measured: m };
  });
}

// ---- render all mounts ------------------------------------------------
(async () => {
  const cal = await calibrate();
  const mounts = [
    ['hero', 360, '50', false],
    ['v1', 128, '65', false],
    ['v2', 128, null, true],
    ['v3', 84, '35', false],
  ];
  for (const [id, w, value, dashes] of mounts) {
    const sign = buildSign(document.getElementById(id), w, value, dashes);
    fitLines(sign, cal);
  }
  window.__signsReady = true;
})();
</script>
